support_cards:
  - id: SP_R_0014
    name: お仕え前の準備運動

    rarity: R
    type: vi
    plan: free
    tag: none

    effects:
      support_event:
        - template: ビジュアル上昇+{value}
          trigger: equip
          type: vi
          values: [ 10, 10, 10, 10, 10 ]
          value_type: status_add

        - template: Pポイント+{value}
          trigger: equip
          type: p_point
          values: [ 10, 10, 10, 10, 10 ]
          value_type: point_add
          unlock_level: 20

      support_ability:
        - template: ビジュアルパラメータボーナス+{value}%
          value_type: param_bonus
          trigger: equip
          type: vi
          values: [ 2.8, 3.2, 3.6, 4, 4.3 ]
          unit: "%"

        - template: 初期Pポイント+{value}
          value_type: point_add
          trigger: produce_start
          type: p_point
          values: [ 20, 20, 20, 20, 20 ]

        - template: このサポートカードのスキルカードサポート発生率を{value}%増加
          value_type: support_rate_bonus
          trigger: equip
          values: [ 48.7, 61.5, 74.4, 87.2, 100 ]
          unit: "%"

        - template: ビジュアルレッスン終了時、ビジュアル上昇+{value}
          value_type: status_add
          trigger: vi_lesson_end
          type: vi
          values: [ 1, 1, 1, 1, 3 ]

        - template: 相談選択時、ビジュアル上昇+{value}
          value_type: status_add
          trigger: consultation
          type: vi
          values: [ 5, 5, 9, 9, 9 ]

        # 0凸Lv20ではLv21効果が未解放。既存Rの扱いに合わせる。
        - template: このサポートカードのイベントによるパラメータ上昇を{value}%増加
